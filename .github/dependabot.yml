version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    target-branch: "dev.patch"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    ignore:
      # typescript-eslint requires typescript <6.1.0 — a major bump makes the
      # whole dependabot job fail with dependency_file_not_resolvable.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    groups:
      dev-dependencies:
        dependency-type: development
        patterns:
          - "*"
      production-dependencies:
        dependency-type: production
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: "/"
    target-branch: "dev.patch"
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"
