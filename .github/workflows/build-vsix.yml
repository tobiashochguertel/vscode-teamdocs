name: Build VSIX

on:
  push:
    branches: [dev.patch]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck, lint, unit tests
        run: |
          npm run typecheck
          npm run lint
          npm run test:unit

      - name: Bundle and package .vsix
        run: |
          node esbuild.js --production
          npx --yes @vscode/vsce package --no-dependencies

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: teamdocs-vsix
          path: "*.vsix"
          retention-days: 30

      - name: Attach VSIX to rolling dev prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git tag -f dev >/dev/null 2>&1 && git push -f origin dev >/dev/null 2>&1 || true
          gh release create dev *.vsix \
            --repo ${{ github.repository }} \
            --title "dev build (${{ github.sha }})" \
            --prerelease \
            --notes "Automated dev.patch build. Install: gh release download dev -p '*.vsix' && code --install-extension teamdocs-*.vsix" \
            --clobber
