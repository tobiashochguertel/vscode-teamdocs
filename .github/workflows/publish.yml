name: Publish Extension

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish-marketplace:
    runs-on: ubuntu-latest
    # Disabled: Microsoft VSID Concurrency rate-limit blocks publish —
    # re-enable when https://github.com/microsoft/vsmarketplace/issues/2256 is resolved.
    if: false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: HaaLeo/publish-vscode-extension@v2
        with:
          pat: ${{ secrets.VSCE_PAT }}
          registryUrl: https://marketplace.visualstudio.com
          dependencies: false

  publish-openvsx:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: HaaLeo/publish-vscode-extension@v2
        with:
          pat: ${{ secrets.OVSX_PAT }}
          registryUrl: https://open-vsx.org
          dependencies: false
